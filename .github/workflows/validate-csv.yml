name: Validate and Convert CSV to JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'joe_jackson_tickets_cleaned.csv'
      - '.github/workflows/validate-csv.yml'
  pull_request:
    branches: [ main ]

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CSV Integrity Checks & Generate JSON
        run: |
          python -c "
          import csv
          import json
          import sys
          import re

          csv_file = 'joe_jackson_tickets_cleaned.csv'
          json_file = 'joe_jackson_tickets_cleaned.json'
          required_headers = ['ID_MEMORABILIA', 'KATEGORIE', 'DATUM', 'MESTO', 'STAT', 'TOUR_NAME']
          date_pattern = re.compile(r'^\d{4}-\d{2}-\d{2}$')

          errors = []
          seen_ids = set()
          rows_data = []

          try:
              with open(csv_file, mode='r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  headers = reader.fieldnames or []

                  for req_h in required_headers:
                      if req_h not in headers:
                          errors.append(f'Chybí povinný sloupec: {req_h}')

                  if errors:
                      print('❌ Chyba hlavičky CSV:')
                      for err in errors:
                          print(f'  - {err}')
                      sys.exit(1)

                  for idx, row in enumerate(reader, start=2):
                      rec_id = (row.get('ID_MEMORABILIA') or '').strip()
                      datum = (row.get('DATUM') or '').strip()

                      if not rec_id:
                          errors.append(f'Řádek {idx}: Prázdné ID_MEMORABILIA.')
                      elif rec_id in seen_ids:
                          errors.append(f'Řádek {idx}: Duplicitní ID_MEMORABILIA \"{rec_id}\".')
                      else:
                          seen_ids.add(rec_id)

                      if datum and not date_pattern.match(datum):
                          errors.append(f'Řádek {idx} (ID: {rec_id}): Neplatný formát data \"{datum}\". Očekáván YYYY-MM-DD.')

                      rows_data.append(row)

          except Exception as e:
              print(f'❌ Soubor se nepodařilo přečíst: {e}')
              sys.exit(1)

          if errors:
              print(f'❌ Nalezeno {len(errors)} chyb při validaci CSV:\n')
              for err in errors[:20]:
                  print(f'  - {err}')
              sys.exit(1)

          print('✅ CSV validace úspěšná! Generuji JSON...')
          with open(json_file, mode='w', encoding='utf-8') as jf:
              json.dump(rows_data, jf, ensure_ascii=False, indent=2)

          print(f'✅ Soubor {json_file} úspěšně vytvořen.')
          "

      - name: Commit & Push updated JSON file
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add joe_jackson_tickets_cleaned.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate JSON from updated CSV [skip ci]" && git push)
