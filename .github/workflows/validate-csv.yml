name: Validate Tickets CSV

on:
  push:
    branches: [ main ]
    paths:
      - 'joe_jackson_tickets_cleaned.csv'
      - '.github/workflows/validate-csv.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'joe_jackson_tickets_cleaned.csv'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CSV Integrity Checks
        run: |
          python -c "
          import csv
          import sys
          import re

          file_path = 'joe_jackson_tickets_cleaned.csv'
          required_headers = ['ID_MEMORABILIA', 'KATEGORIE', 'DATUM', 'MESTO', 'STAT', 'TOUR_NAME']
          date_pattern = re.compile(r'^\d{4}-\d{2}-\d{2}$')

          errors = []
          seen_ids = set()

          try:
              with open(file_path, mode='r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  headers = reader.fieldnames or []

                  # 1. Kontrola přítomnosti povinných sloupců
                  for req_h in required_headers:
                      if req_h not in headers:
                          errors.append(f'Chybí povinný sloupec: {req_h}')

                  if errors:
                      print('❌ Chyba hlavičky CSV:')
                      for err in errors:
                          print(f'  - {err}')
                      sys.exit(1)

                  # 2. Kontrola jednotlivých řádků
                  for idx, row in enumerate(reader, start=2): # start=2 kvůli hlavičce na řádku 1
                      rec_id = (row.get('ID_MEMORABILIA') or '').strip()
                      datum = (row.get('DATUM') or '').strip()

                      # Kontrola unikátnosti ID
                      if not rec_id:
                          errors.append(f'Řádek {idx}: Prázdné ID_MEMORABILIA.')
                      elif rec_id in seen_ids:
                          errors.append(f'Řádek {idx}: Duplicitní ID_MEMORABILIA \"{rec_id}\".')
                      else:
                          seen_ids.add(rec_id)

                      # Kontrola formátu data (YYYY-MM-DD), pokud je zadáno
                      if datum and not date_pattern.match(datum):
                          errors.append(f'Řádek {idx} (ID: {rec_id}): Neplatný formát data \"{datum}\". Očekáván YYYY-MM-DD.')

          except Exception as e:
              print(f'❌ Soubor se nepodařilo přečíst: {e}')
              sys.exit(1)

          # 3. Vyhodnocení výsledků
          if errors:
              print(f'❌ Nalezeno {len(errors)} chyb při validaci CSV:\n')
              for err in errors[:20]: # Zobrazí maximálně prvních 20 chyb
                  print(f'  - {err}')
              if len(errors) > 20:
                  print(f'  ... a dalších {len(errors) - 20} chyb.')
              sys.exit(1)

          print('✅ CSV soubor prošel všemi kontrolami úspěšně!')
          "
