<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Jackson Memorabilia Museum - Concert Tickets, Tour Archive &amp; Setlists (1978–2026)</title>
  
  <meta name="description" content="Explore the comprehensive digital archive and museum dedicated to Joe Jackson's live concert history from 1978 to 2026. Discover vintage ticket stubs, tour dates, venues, setlists, and memorabilia.">
  <meta name="keywords" content="Joe Jackson, Joe Jackson concert tickets, Joe Jackson tour history, Joe Jackson setlists, live music archive, memorabilia museum, Look Sharp, Night and Day, live concerts, tour dates">
  <meta name="author" content="Joe Jackson Memorabilia Museum">
  <meta name="theme-color" content="#f59e0b">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://joejackson.band/">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Joe Jackson Memorabilia Museum">
  <meta property="og:url" content="https://joejackson.band/">
  <meta property="og:title" content="Joe Jackson Memorabilia Museum - Concert Tickets, Tour Archive &amp; Setlists">
  <meta property="og:description" content="Comprehensive digital archive and museum dedicated to Joe Jackson's live concert history from 1978 to 2026. Discover ticket stubs, setlists, and memorabilia.">
  <meta property="og:image" content="https://joejackson.band/favicon.svg">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://joejackson.band/">
  <meta name="twitter:title" content="Joe Jackson Memorabilia Museum - Concert Tickets, Tour Archive &amp; Setlists">
  <meta name="twitter:description" content="Comprehensive digital archive and museum dedicated to Joe Jackson's live concert history from 1978 to 2026. Discover ticket stubs, setlists, and memorabilia.">
  <meta name="twitter:image" content="https://joejackson.band/favicon.svg">

  <!-- Favicon (JJ Icon) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
</head>
<body>

  <div class="top-header-container">
    <header>
      <div class="header-left">
        <div class="logo">JJ</div>
        <div class="title-area">
          <h1>Joe Jackson´s Memorabilia Museum <span class="year-badge" id="yearBadge">...</span></h1>
          <p>Historical archive of Joe Jackson´s concert tickets, venues & memorabilia</p>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <a href="stats.html" class="btn-contribute" title="View tour map & museum analytics">
          📊 Stats & Map
        </a>
        <a href="edit_ticket_new.html" id="adminEditorLink" class="btn-contribute" style="display: none;" title="Open CSV Record Editor">
          ✏️ Editor
        </a>
        <button id="adminLockBtn" class="btn-contribute" style="display: none; background: #dc2626; color: #ffffff; border: none; cursor: pointer; font-family: inherit;" onclick="lockAdminSession()" title="Lock Admin Session and return to Public Mode">
          🔒 Lock Admin
        </button>
        <a href="edit_ticket_new.html" id="adminLoginLink" class="btn-contribute" style="background: transparent; border: 1px solid var(--border-color-light, #333);" title="Admin Login Gate">
          🔒 Admin
        </a>
        <a href="ticket_form.html" class="btn-contribute" title="Share your concert ticket, pass, or poster with us">
          ➕ Contribute your item
        </a>
      </div>
    </header>

    <!-- On This Day Banner -->
    <div class="on-this-day-banner" id="otdBanner">
      <div class="otd-left">
        <div class="otd-icon">📅</div>
        <div class="otd-text">
          <h4>On This Day In History</h4>
          <p id="otdTitle">...</p>
        </div>
      </div>
      <button class="otd-btn" id="otdBtn">🎫 View Anniversary Show</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="controls">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Search by city, venue, date...">
        <button class="search-clear-btn" id="searchClearBtn" title="Clear search">✕</button>
      </div>

      <button class="surprise-btn" id="reshuffleBtn" title="Reshuffle all records">🎲 Reshuffle</button>
      <button class="surprise-btn" id="surpriseBtn" title="Open a random memorabilia record">✨ Surprise Me!</button>

      <select id="yearFilter"><option value="">All Years</option></select>
      <select id="cityFilter"><option value="">All Cities</option></select>
      <select id="sortFilter">
        <option value="random">🎲 Random / Shuffled</option>
        <option value="oldest">Date (Oldest First)</option>
        <option value="newest">Date (Newest First)</option>
        <option value="missing_first">📷 Missing Scans First</option>
        <option value="missing_only">🔍 Missing Scans Only</option>
        <option value="scans_only">🖼️ With Scans Only</option>
      </select>
      <select id="pageSizeFilter">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="ALL">ALL</option>
      </select>
      <div class="layout-toggles">
        <button class="toggle-btn active" id="btnGrid">⊞</button>
        <button class="toggle-btn" id="btnList">≡</button>
      </div>
    </div>
  </div>

  <div id="ticketsContainer" class="tickets-container grid-view"></div>
  <div id="paginationContainer" class="pagination-container"></div>

  <!-- Video Modal Layout -->
  <div id="videoModal">
    <div class="video-modal-container">
      <button class="jj-close-btn" id="videoModalCloseBtn">✕</button>
      
      <!-- Left: Lineup -->
      <div class="jj-video-side-col" id="videoLineupCol"></div>

      <!-- Center: Video Frame -->
      <div class="jj-video-center">
        <div class="jj-video-frame-wrapper">
          <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Right: Setlist -->
      <div class="jj-video-side-col" id="videoSetlistCol"></div>
    </div>
  </div>

  <!-- Main Application Script -->
  <script src="storage-service.js"></script>
  <script src="app.js"></script>
</body>
</html>
